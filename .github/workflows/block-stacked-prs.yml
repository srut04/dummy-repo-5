name: Block PRs stacked on dev

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - dev

permissions:
  pull-requests: read
  contents: read

jobs:
  block-stacked-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Block Stacked PRs
        run: |
          echo "${{ github.event.pull_request.base.ref }}"
          if [ "${{ github.event.pull_request.base.ref }}" != "dev" ]; then
            echo "::error::Stacked pull requests are not allowed."
            exit 1
          fi
